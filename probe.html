<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ПЕРЕЛОМ — щуп</title>
<style>
  body { background:#0a0709; color:#f4e9e7; font:13px ui-monospace,monospace; margin:0; padding:16px; }
  h2 { font-size:12px; letter-spacing:.2em; color:#ff2d55; margin:18px 0 6px; font-weight:600; }
  canvas { width:100%; max-width:760px; height:auto; display:block; background:#05060a; }
  p { color:#8c8082; margin:4px 0 0; max-width:76ch; line-height:1.5; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
/**
 * Щуп: рисует отдельные моменты боя без игрового цикла.
 * Только для разработки — на сервер не едет.
 */
import { createFight, stepFrame, STATE } from './src/fight.js';
import { draw } from './src/render.js';
import { BROKEN, TORN } from './src/body.js';
import { POSES } from './src/poses.js';
import { STICKS, createSkeleton } from './src/physics.js';
import { loadArenaArt, loadFighterArt } from './src/sprites.js';

const ART = { zhila: loadFighterArt('zhila'), kostolom: loadFighterArt('kostolom'), arena: loadArenaArt('dusk') };

const NEUTRAL = {
    left: false, right: false, up: false, down: false,
    hand: false, foot: false, grab: false, pull: false,
    dashLeft: false, dashRight: false,
};
const still = () => ({ ...NEUTRAL });
const once = (press, hold = {}) => {
    let done = false;
    return () => (done ? { ...NEUTRAL, ...hold } : ((done = true), { ...NEUTRAL, ...hold, ...press }));
};
const drive = (fight, frames, a = still, b = still) => {
    for (let i = 0; i < frames; i += 1) stepFrame(fight, [a, b]);
};
const place = (fight, gap) => {
    fight.fighters[0].x = fight.centerX - gap / 2;
    fight.fighters[1].x = fight.centerX + gap / 2;
    drive(fight, 1);
};

const out = document.getElementById('out');
const redraws = [];

function shot(title, note, build) {
    const h = document.createElement('h2');
    h.textContent = title;
    const canvas = document.createElement('canvas');
    canvas.id = `shot-${index++}`;
    canvas.width = 960;
    canvas.height = 540;
    const p = document.createElement('p');
    p.textContent = note;
    out.append(h, canvas, p);
    const render = () => {
        const fight = createFight({ seed: 4 });
        fight.fighters[0].art = ART.zhila;
        fight.fighters[1].art = ART.kostolom;
        fight.arenaArt = ART.arena;
        build(fight);
        draw(canvas.getContext('2d'), fight, 960, 540, 1);
    };
    redraws.push(render);
    render();
}

let index = 0;

/** Лист всех поз: по нему сверяется заказ на графику. */
function poseSheet(names, sheet) {
    const h = document.createElement('h2');
    h.textContent = `ПОЗЫ ${sheet + 1} — эталон для заказа графики`;
    const canvas = document.createElement('canvas');
    canvas.id = `shot-poses-${sheet}`;
    canvas.width = 960;
    canvas.height = 480;
    const p = document.createElement('p');
    p.textContent = 'Каждая кость одной длины во всех позах. Точками отмечены суставы.';
    out.append(h, canvas, p);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#141018';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const stepX = canvas.width / names.length;
    const groundY = 430;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const WIDTH = { spine: 30, ribs: 26, skull: 18, arm: 13, leg: 16 };
    names.forEach((name, i) => {
        const x = stepX * (i + 0.5);
        const sk = createSkeleton(POSES[name], x, groundY, 1);
        ctx.strokeStyle = '#0a0a10';
        for (const stick of sk.sticks) {
            if (!stick.bone) continue;
            ctx.lineWidth = WIDTH[stick.bone];
            ctx.beginPath();
            ctx.moveTo(sk.points[stick.a].x, sk.points[stick.a].y);
            ctx.lineTo(sk.points[stick.b].x, sk.points[stick.b].y);
            ctx.stroke();
        }
        ctx.fillStyle = '#0a0a10';
        ctx.beginPath();
        ctx.arc(sk.points.head.x, sk.points.head.y, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ff2d55';
        for (const id of Object.keys(sk.points)) {
            ctx.beginPath();
            ctx.arc(sk.points[id].x, sk.points[id].y, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.fillStyle = '#8c8082';
        ctx.font = '600 17px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText(name, x, groundY + 28);
    });
}

const POSE_NAMES = Object.keys(POSES);
for (let i = 0; i * 4 < POSE_NAMES.length; i += 1) poseSheet(POSE_NAMES.slice(i * 4, i * 4 + 4), i);

shot('СТОЙКА', 'Двое в нейтралке. Камера держит обоих и наезжает, когда сходятся.', (f) => {
    place(f, 190);
    drive(f, 6);
});

shot('УДАР НОГОЙ В КОНТАКТ', 'Кадр попадания. Оранжевый след — телеграф типа удара: без него перехват был бы угадайкой.', (f) => {
    place(f, 108);
    drive(f, 18, once({ foot: true }));
});

shot('ПЕРЕХВАТ ОТКРЫТ', 'Голубое кольцо — окно перехвата. Видно, что боец рискует прямо сейчас.', (f) => {
    place(f, 108);
    drive(f, 6, still, once({ hand: true, pull: true }));
});

shot('ДЖАГЛ', 'Перехват подбросил, дальше решает исполнение: рука держит в воздухе, нога выбивает.', (f) => {
    place(f, 80);
    drive(f, 14, once({ hand: true }), once({ hand: true, pull: true }));
    const juggler = (state, side) => {
        const me = state.fighters[side];
        const free = me.state === STATE.idle || me.state === STATE.walk;
        return { ...NEUTRAL, left: true, hand: free };
    };
    drive(f, 26, still, juggler);
});

shot('БРОСОК', 'Бросок берёт и блок, и перехват — но только вплотную, и разгоняется дольше всех.', (f) => {
    place(f, 70);
    drive(f, 24, once({ grab: true }), () => ({ ...NEUTRAL, right: true }));
});

shot('ПЕРЕЛОМ (рентген)', 'Камера ныряет к той кости, которая приняла импульс. Ролик не нарисован — он вычислен.', (f) => {
    place(f, 108);
    f.fighters[1].body.bones.ribs.stress = 900;
    drive(f, 24, once({ foot: true }), once({ hand: true, pull: true }));
    drive(f, 30);
});

shot('ОТОРВАННАЯ РУКА', 'Оторванного звена просто нет в силуэте, а на его месте — культя.', (f) => {
    f.fighters[1].body.bones.arm.state = TORN;
    f.fighters[1].body.bones.ribs.state = BROKEN;
    place(f, 150);
    drive(f, 6);
});

// Картинки едут асинхронно: перерисовываем щуп, когда они приехали.
setTimeout(() => { for (const again of redraws) again(); }, 700);
setTimeout(() => { for (const again of redraws) again(); }, 2000);
</script>
</body>
</html>
